<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checkout Dealer Honda</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(135deg, #d60000, #ff3b3b);
    }

    .checkout-box{
      background:#fff;
      padding:50px;
      border-radius:20px;
      text-align:center;
      box-shadow:0 10px 25px rgba(0,0,0,0.2);
      max-width:500px;
      width:90%;
    }

    .logo{
      font-size:40px;
      font-weight:bold;
      color:#d60000;
      margin-bottom:20px;
    }

    h1{
      color:#222;
      font-size:32px;
      margin-bottom:15px;
    }

    p{
      color:#555;
      font-size:18px;
      line-height:1.6;
    }

    .footer{
      margin-top:30px;
      font-size:14px;
      color:#888;
    }
  </style>
</head>
<body>

  <div class="checkout-box">
    <div class="logo">HONDA DEALER</div>

    <h1>Terima Kasih</h1>

    <p>
      Terima kasih sudah berkunjung dan melakukan checkout di Dealer Honda kami.
      Kepuasan Anda adalah prioritas kami.
    </p>

    <div class="footer">
      © 2026 Dealer Honda Indonesia
    </div>
  </div>

</body>
</html>
